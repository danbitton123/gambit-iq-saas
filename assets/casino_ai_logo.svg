<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-labelledby="title">
  <title id="title">CasinoAI</title>
  <rect width="420" height="96" rx="18" fill="#071c24"/>

  <!-- poker-chip disc -->
  <circle cx="49" cy="48" r="27" fill="#0a2630" stroke="#27d17f" stroke-width="1.6"/>

  <!-- chip edge notches -->
  <g stroke="#d9a72e" stroke-width="4" stroke-linecap="round">
    <line x1="49" y1="19" x2="49" y2="14"/>
    <line x1="69.5" y1="27.5" x2="73.0" y2="24.0"/>
    <line x1="78" y1="48" x2="83" y2="48"/>
    <line x1="69.5" y1="68.5" x2="73.0" y2="72.0"/>
    <line x1="49" y1="77" x2="49" y2="82"/>
    <line x1="28.5" y1="68.5" x2="25.0" y2="72.0"/>
    <line x1="20" y1="48" x2="15" y2="48"/>
    <line x1="28.5" y1="27.5" x2="25.0" y2="24.0"/>
  </g>

  <!-- AI node cluster -->
  <g stroke="#26c6e5" stroke-width="1.4" opacity=".9">
    <line x1="49" y1="39" x2="40" y2="56"/>
    <line x1="49" y1="39" x2="58" y2="56"/>
    <line x1="40" y1="56" x2="58" y2="56"/>
  </g>
  <circle cx="49" cy="39" r="3.6" fill="#d9a72e"/>
  <circle cx="40" cy="56" r="2.8" fill="#26c6e5"/>
  <circle cx="58" cy="56" r="2.8" fill="#26c6e5"/>

  <!-- wordmark -->
  <text x="96" y="57" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="3"><tspan fill="#f4f7fb">CASINO</tspan><tspan fill="#26c6e5">AI</tspan></text>
  <text x="99" y="77" fill="#8da3b4" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2">OPERATOR INTELLIGENCE</text>
</svg>
